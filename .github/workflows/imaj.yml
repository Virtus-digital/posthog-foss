# Virtus fork'unun imaj derlemesi:
#   ghcr.io/virtus-digital/posthog-foss:<commit>       (web, worker, temporal-django-worker)
#   ghcr.io/virtus-digital/posthog-foss-node:<commit>  (plugins, ingestion-*, recording-api)
#
# NEDEN AYRI BIR WORKFLOW
#   Kullanici karari (2026-10-16): PostHog'un upstream imaji (posthog/posthog,
#   icinde ee/ kodu var) KULLANILMIYOR; uygulama imajlari bu FOSS fork'undan
#   derleniyor. Upstream FOSS aynasi `.github/workflows` TASIMIYOR (olculdu
#   2026-10-16: fork'un master'inda `.github/` var, `workflows/` yok), yani
#   master'dan tetiklenecek upstream isi yok. Varsayilan dal `virtus` upstream
#   kodu tasimiyor: yalniz bu workflow + README.md. Yordam: README.md.
#
# KAYNAK KAPISI
#   Girdi bir commit (40 hex) ve PostHog/posthog-foss'un `master` ucu
#   OLMAK ZORUNDA (`git ls-remote`, derleme aninda). Kaynak agac o uctan
#   checkout ediliyor (repository: PostHog/posthog-foss), fork'un master'indan
#   DEGIL.
#   NEDEN YALNIZ UC (2026-10-17 olculdu, ilk derleme 39028229557 bu kapinin
#   onceki hali yuzunden dustu): FOSS aynasinin master'i = upstream
#   PostHog/posthog'un ham gecmisi + EN USTTE tek bir "Sync and remove all
#   non-FOSS parts" commit'i, ve her senkronda o tek commit YENIDEN YAZILIYOR.
#   Onceki senkronun commit'i (8f87779) yeni master'in gecmisinde degil:
#   compare `diverged`, ahead_by 100, behind_by 1, merge base = onun ebeveyni.
#   Yani "master gecmisinde mi" kapisi yalniz ucu kabul ediyordu ve gecmisin
#   geri kalani ee/'li ham commit'ler (onlari "FOSS agaci mi" adimi eliyor).
#   Ucta olmak, commit'in upstream'in KENDI ref'inin gosterdigi agac oldugunu
#   kanitliyor; fork agindaki paylasilan nesneler bu esitligi saglayamaz.
#   Bedeli: yalniz o anki uc derlenebilir; derleme sirasinda upstream yeniden
#   senkronlarsa kapi kirmizi yanar, yeni uc ile tekrar tetiklenir.
#
# DERLEME YAMASI (yalniz web imaji) — BILEREK, sessiz degil
#   FOSS agacinda `ee/` YOK ama upstream Dockerfile onu uc yerde istiyor:
#   iki `COPY ... ee ee/` satiri ve `compileall` listesindeki `ee`. Oldugu
#   gibi derlenmez (COPY kaynagi yok). "Dockerfile'i yamala" adimi bu uc
#   yeri SILIYOR ve her birinin TAM BIR KEZ eslesmesini istiyor; upstream
#   Dockerfile degisirse adim kirmizi yanar, yama sessizce yanlis yere
#   uygulanmaz. ee/'nin yoklugu calisma zamaninda zaten bekleniyor:
#   posthog/settings/ee.py `from ee.apps import ...` ImportError'unda
#   EE_AVAILABLE=False birakiyor.
#
# DEGISMEZLIK
#   Ayni etiket ikinci kez derlenmez: imaj etiketi varsa is kirmizi yanar.
#   Etiket commit sha'si; deploy etiket + digest ile sabitler.
#
# RUNNER: Virtus ARC, kendi grubunda (`posthog-imaj`) ve kendi scale set'inde
#   (deploy -> platform-fra/arc-runners-posthog). Bu repo public oldugu icin
#   org'un ana grubu ("Default", allows_public_repositories=false) onu
#   calistirmiyor. Grup YALNIZ bu dosyaya, YALNIZ `refs/heads/virtus`
#   uzerinden acik (`restricted_to_workflows`); dosyanin adi ya da dali
#   degisirse grubun `selected_workflows` listesi de degismeli. Emsal:
#   Virtus-digital/paperclip (K8s-structure ADR-039).
#
# Upstream'den farklar (container-images-cd.yml, ci-nodejs-container.yml):
#   depot yerine buildx · yalniz linux/amd64 (fra node'lari amd64) ·
#   kaynak harita yuklemesi YOK (Dockerfile o adimi gizli anahtar yoksa
#   atliyor ve .map dosyalarini imajda birakiyor; GITHUB_* build-arg'lari
#   bilerek verilmiyor) · DockerHub/ECR yok, yalniz GHCR · onbellek YOK
#   (derleme seyrek ve elle; mode=max katmanlari GB mertebesinde) ·
#   buildx surucusu `docker` (gerekce "Set up Docker Buildx" adiminda).
name: imaj

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "PostHog/posthog-foss master'inin GUNCEL ucu (40 hex): git ls-remote https://github.com/PostHog/posthog-foss refs/heads/master"
        required: true
        type: string

permissions: {}

concurrency:
  group: imaj-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  derle:
    # TETIKLEYEN KAPISI: yalniz listedeki kullanici derleme baslatabilir.
    #   Kosul is duzeyinde: yetkisiz tetiklemede is `skipped` olur ve ARC'den
    #   runner HIC istenmez. `actor` ve `triggering_actor` ikisi de bakiliyor:
    #   yeniden kosturmada tetikleyen degisebilir. Emsal paperclip imaj.yml.
    if: >-
      contains(fromJSON('["Melihunlu"]'), github.actor) &&
      contains(fromJSON('["Melihunlu"]'), github.triggering_actor)
    runs-on: virtusdigital-arc-posthog
    # Sure OLCULMEDI: upstream depot'ta 25 dk sinirla derliyor; burada dind
    # 8 CPU ile sinirli ve onbellek yok.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: web
            dockerfile: Dockerfile
            imaj: ghcr.io/virtus-digital/posthog-foss
          - ad: node
            dockerfile: Dockerfile.node
            imaj: ghcr.io/virtus-digital/posthog-foss-node
    permissions:
      contents: read
      packages: write
    env:
      COMMIT: ${{ inputs.commit }}
      IMAJ: ${{ matrix.imaj }}
      UPSTREAM: https://github.com/PostHog/posthog-foss
    steps:
      # ARC'de docker dind sidecar'indan geliyor; yoksa sebebi sidecar'in
      # kendisi. paperclip imaj.yml'deki ayni yoklama.
      - name: Docker var mi (yoklama)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Bu runner'da docker YOK (dind sidecar'i ayakta degil)."
            exit 1
          fi
          docker version --format '{{.Server.Version}}' || {
            echo "::error::docker istemcisi var ama sunucuya baglanamiyor."
            exit 1; }

      - name: Girdiyi dogrula, upstream ucuyla karsilastir
        run: |
          set -euo pipefail
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "gecersiz commit: '$COMMIT' (beklenen: 40 hex, kucuk harf)" >&2
            exit 1
          fi
          uc="$(git ls-remote "$UPSTREAM" refs/heads/master | awk '{print $1}')"
          echo "upstream master ucu: ${uc:-<okunamadi>}"
          if [ "$uc" != "$COMMIT" ]; then
            echo "KAYNAK KAPISI: commit PostHog/posthog-foss master'inin ucu degil (FOSS aynasi her senkronda ucu yeniden yaziyor; guncel ucla tekrar tetikle)" >&2
            exit 1
          fi
          echo "- kaynak: \`${COMMIT}\` = PostHog/posthog-foss master ucu (derleme ani)" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiket daha once yayinlanmis mi
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAJ}:${COMMIT}" > /dev/null 2>&1; then
            echo "${IMAJ}:${COMMIT} zaten var; ayni etiket yeniden derlenmez" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: PostHog/posthog-foss
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: FOSS agaci mi (ee/ yok)
        run: |
          set -euo pipefail
          if [ -e ee ]; then
            echo "agacta ee/ VAR: bu bir FOSS agaci degil (upstream'in ham commit'i). FOSS aynasinin 'Sync and remove all non-FOSS parts' commit'ini sec." >&2
            exit 1
          fi

      - name: Dockerfile'i yamala (ee/ yok)
        if: matrix.ad == 'web'
        run: |
          set -euo pipefail
          sayi() { grep -cF -- "$1" Dockerfile || true; }
          tam() { grep -cxF -- "$1" Dockerfile || true; }
          [ "$(tam 'COPY ee ee/')" = 1 ] || { echo "beklenen 'COPY ee ee/' satiri tam bir kez yok" >&2; exit 1; }
          [ "$(tam 'COPY --chown=posthog:posthog ee ee/')" = 1 ] || { echo "beklenen chown'lu ee COPY satiri tam bir kez yok" >&2; exit 1; }
          [ "$(sayi ' manage.py posthog ee common/hogvm ')" = 1 ] || { echo "compileall listesinde beklenen 'ee' tam bir kez yok" >&2; exit 1; }
          cp Dockerfile "$RUNNER_TEMP/Dockerfile.orijinal"
          sed -i \
            -e '/^COPY ee ee\/$/d' \
            -e '/^COPY --chown=posthog:posthog ee ee\/$/d' \
            -e 's| manage\.py posthog ee common/hogvm | manage.py posthog common/hogvm |' \
            Dockerfile
          if grep -nE '(^|[[:space:]])ee(/|[[:space:]]|$)' Dockerfile; then
            echo "Dockerfile hala ee/ istiyor (yukaridaki satirlar)" >&2
            exit 1
          fi
          {
            echo "- Dockerfile yamasi (ee/ satirlari silindi):"
            echo '```diff'
            diff -u "$RUNNER_TEMP/Dockerfile.orijinal" Dockerfile || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # driver: docker — BILEREK. Varsayilan `docker-container` surucusu
      # builder'i dockerd'in `--cgroup-parent`ini DEVRALMADAN host kokunde
      # (`/docker/buildx/<id>`, memory.max=max) aciyor (K8s-structure
      # docs/platform/23 §5k "BILINEN SINIR", yerelde olculdu). O zaman
      # Dockerfile.node'un 16 GB heap'li turbo derlemesi dind'in 24Gi
      # sinirinin DISINDA kosar ve node'da global OOM uretebilir.
      # `docker` surucusu dockerd'in kendi (gomulu) builder'i ve dockerd'in
      # cgroup-parent'ini izliyor: cgroup-parent duzeltmesinden ONCEKI
      # olcumde gomulu builder `/docker/buildkit`, yani dockerd'in o zamanki
      # varsayilan parent'i altindaydi (docs/23, fra-2/3/5/7 tablosu). Bu
      # havuzda DOGRULANMADI: ilk derlemede dind konteynerinin bellek
      # zirvesi kps'te (container="dind") derlemeyi tasimali. Bedeli:
      # registry cache-to yok (zaten kullanilmiyor), tek platform (zaten
      # yalniz amd64).
      # Kaynak: deploy PR #1427, App incelemesi F1.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            COMMIT_HASH=${{ inputs.commit }}
          tags: ${{ env.IMAJ }}:${{ inputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.commit }}
            io.virtusdigital.posthog.source-repo=PostHog/posthog-foss
            org.opencontainers.image.licenses=MIT
            io.virtusdigital.posthog.patched-dockerfile=${{ matrix.ad == 'web' }}
          push: true
          provenance: false

      # Havuzun dind/runner kaynak sinirlari (deploy -> platform-fra/
      # arc-runners-posthog/values.yaml) OLCULMEDEN yazildi; bu adim ilk
      # kosudan itibaren tepe noktaya yakin disk degerlerini basiyor, is
      # dusse de kosar. Bellek zirvesi kps'ten okunur
      # (container_memory_working_set_bytes, container="dind").
      - name: Disk olcumu
        if: always()
        run: |
          set +e
          docker system df
          docker buildx du 2>/dev/null | tail -3
          df -h / /home/runner/_work 2>/dev/null

      - name: Ozet
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "- deploy referansi: \`${IMAJ}:${COMMIT}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
